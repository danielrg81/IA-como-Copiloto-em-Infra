apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: ai-iac-lab
  labels:
    app: notification-api
    version: "0.2.3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
        version: "0.2.3"
    spec:
      containers:
      - name: notification-api
        image: hashicorp/http-echo:0.2.3
        args: ["-text=notification-api running"]
        ports:
        - containerPort: 5678
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-api
  namespace: ai-iac-lab
  labels:
    app: notification-api
spec:
  selector:
    app: notification-api
  ports:
  - port: 80
    targetPort: 5678
  type: ClusterIP
